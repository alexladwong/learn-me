[auth]
# App origins the backend may redirect back to after OAuth / email links.
#
# The OAuth callback path must be listed explicitly, not just the origin: the
# sign-in action passes the full `http://localhost:3000/api/auth/callback` as its
# `redirectTo`, and the backend compares against this list verbatim. With only the
# bare origin configured, "Sign in with Google" failed with
# "…/api/auth/callback is not in the allowed redirect URLs".
#
# Add the production origin **and** its `/api/auth/callback` before deploying.
allowed_redirect_urls = [
  # --- Local development -------------------------------------------------
  "http://localhost:3000",
  "http://localhost:3000/api/auth/callback",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/api/auth/callback",
  # --- Production web ----------------------------------------------------
  #
  # The exact callback, not just the origin: the backend compares this list
  # verbatim, so an origin entry alone leaves the callback rejected with
  # "…/api/auth/callback is not in the allowed redirect URLs".
  #
  # This list is additive on purpose. Production does not replace localhost —
  # both are real environments, and the app derives which one to use from the
  # incoming request rather than from a hardcoded constant.
  "https://learn-me-01.vercel.app",
  "https://learn-me-01.vercel.app/api/auth/callback",
  # --- Vercel preview deployments ----------------------------------------
  #
  # A preview gets a random hostname per deployment (`learn-me-git-<branch>-
  # <team>.vercel.app`), so allowlisting each one is not possible. Set
  # `NEXT_PUBLIC_APP_URL=https://learn-me-01.vercel.app` in Vercel's *Preview*
  # environment and previews will hand OAuth to this stable callback instead of
  # their own — see `requestOriginFromHeaders()` in `lib/env.ts` for the order.
  #
  # Add a specific preview origin here only if you want that preview to keep
  # users on its own hostname; the provider will otherwise reject the callback.
  # --- Native shell -------------------------------------------------------
  # The Capacitor shell's OAuth return path.
  #
  # Google refuses OAuth inside an embedded WebView (`disallowed_useragent`), so
  # the shell opens the flow in the system browser. The backend then redirects to
  # this custom scheme, the OS hands the URL to the app, and the app exchanges
  # `insforge_code` server-side — which is why no session token ever appears in a
  # deep link.
  #
  # Compared verbatim like every other entry, so it must carry the exact path and
  # must not carry a query string.
  "learnme://auth/callback",
]
# Email verification is off while SMTP is unconfigured: with it on, email
# signups cannot complete because the verification code is never delivered.
# Turn this back on (and configure [auth.smtp]) before production launch.
require_email_verification = false
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 8
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
